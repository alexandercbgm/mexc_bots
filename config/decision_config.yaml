# =================================================================
# 1. СИГНАЛЬНЫЙ МОДУЛЬ (SIGNAL_MODULE)
# =================================================================
SIGNAL_MODULE:
  ENTRY_TIME_OFFSET_SEC: 10               # Смещение в секундах до конца свечи для отправки ордера.

# =================================================================
# 2. ФИЛЬТРЫ (FILTERS)
# =================================================================
FILTERS:
  # --- 2.1. Фильтр Волатильности ---
  BODY_VOLATILITY:
    BODY_PERCENTILE_PERIOD: 5             # Период для расчета процентилей.
    BODY_PERCENTILE_LOWER: 5              # Нижний процентиль для аномально маленькой свечи.
    BODY_PERCENTILE_UPPER: 95             # Верхний процентиль для аномально большой свечи.
    BODY_MIN_POINTS: 2

    # --- 2.1.1. Исключение для Больших Свечей ---
    ENABLE_MAX_BODY_EXCEPTION: true       # Применять исключение для больших свечей.
    MAX_BODY_RATIO: 1.2                   # Допустимое отличие тела от максимума за период.

  # --- 2.2. Фильтр Тренда ---
  TREND:
    WMA_PERIOD: 20
    WMA_ANGLE_PERIOD: 5
    WMA_ANGLE_LIMIT: -25

  # --- 2.3. Фильтр Боковика ---
  FLAT:
    FLAT_PERIOD_N: 8              # N: Количество свечей для анализа истории
    FLAT_BALANCE_K: 0.8           # K: Минимальный коэффициент K_34 для признания баланса
    FLAT_USE_SHADOW: False        # Использовать ли тени (True) или только тела (False) для расчета цен/границ
    FLAT_PERCENTILE_P: 5          # P: Процентиль для определения границ боковика (5% и 95%)
    FLAT_BREAKOUT_B: 2            # B: Максимальное количество свечей, которые могут выйти за границы боковика (исключая текущую)

# =================================================================
# 3. МОДУЛЬ УПРАВЛЕНИЯ СТОПАМИ (STOP_MANAGEMENT)
# =================================================================
STOP_MANAGEMENT:
  # --- 3.1. Параметры Тайминга и Смещений ---
  TRAILING_UPDATE_TIME_OFFSET_SEC: 10     # Смещение в секундах для обновления стопа.
  ADJACENT_CANDLE_BODY_MULTIPLIER: 0.334  # 1/3 смещения для стопа на открытии большой свечи.
  MIN_STOP_MOVE_POINTS: 1                 # Минимальное смещение стопа в пунктах.
  TS_ACC_DIST_POINTS: 6                   # Накопленное расстояние в пунктах от стопа до цены.
  TS_MOVE_MULTIPLIER: 0.5                 # Доля накопленного расстояния, куда будем двигать стоп.
  # OPEN_POS_SL_ROE: 0.25 # 1m
  OPEN_POS_SL_ROE: 0.50 # 5m

  # --- 3.2. Параметры Таймаутов и Безубытка ---
  BREAKEVEN_PROFIT_RATIO: 1.0             # Рост для безубытка (x1 тело сигнальной свечи).
  BREAKEVEN_IDLE_CANDLES: 2               # Свечей для безубытка.

# =================================================================
# 4. МОДУЛЬ УПРАВЛЕНИЯ РИСК-МЕНЕДЖМЕНТОМ (RISK_MANAGEMENT)
# =================================================================
RISK_MANAGEMENT:
  # --- 4.1. Управление Размером Позиции ---
  POSITION_SIZING:
    FIXED_MARGIN_USD: 1              
    LEVERAGE_FACTOR: 10               

  # --- 4.2. Управление Убытками и Перерывами ---
  LOSS_LIMITS:
    MAX_CONSECUTIVE_LOSS_DEALS: 3         # Считаем количество идущих подряд убыточных сделок.
    INITIAL_STOP_SENSITIVE_LEVEL: 0.25    # Порог убытка от начального стопа, выше которого учитывается убыток.
    BREAK_DURATION_SHORT_MINUTES: 20

  # --- 4.3. Управление Капиталом ---
  CAPITAL:
    MARGIN_LOSS_LIMIT_PAUSE: 0.05
    MARGIN_LOSS_LIMIT_HALT: 0.3